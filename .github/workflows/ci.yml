name: CI & Advanced Integrity Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  core-build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Native/LocalConvertNative.sln

      - name: Build solution
        run: dotnet build Native/LocalConvertNative.sln --configuration Release --no-restore

      - name: Run Core Tests with Coverage
        run: |
          dotnet test Native/LocalConvertNative.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --settings coverlet.runsettings

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: "**/coverage.cobertura.xml"

  advanced-integrity-matrix:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        category: [
          Metamorphic,
          Concolic,
          FloatPrecision,
          Linearizability,
          ModelChecking,
          Endianness,
          Byzantine,
          Grey,
          ProcessPause,
          BitRotCorruption,
          RetryStorm,
          ZombieOrphan,
          UXAuditing,
          SecurityHardening,
          OSKernelHardware,
          NetworkDataLayer
        ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and Build Test Category
        run: |
          dotnet build Tests/Advanced/${{ matrix.category }}/${{ matrix.category }}.csproj --configuration Release

      - name: Run Category Suite
        run: |
          dotnet test Tests/Advanced/${{ matrix.category }}/${{ matrix.category }}.csproj --configuration Release --no-build --logger "trx;LogFileName=${{ matrix.category }}.trx"
